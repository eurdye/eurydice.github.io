<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>$title$</title>
        <link rel="stylesheet" href="sakura-vader.css" type="text/css">

        <link rel="stylesheet" href="css/glightbox.css" />
        <script src="js/glightbox.min.js"></script>




        <!-- Custom Style Overrides -->
        <style>
header nav {
    text-align: center;
    margin-bottom: 1em;
}
                    header nav a {
                        margin: 0 10px; /* Adds even spacing between the links */
                    }
                    footer {
                        text-align: center;
                    }

                    /* Only apply grid layouts on screens wider than 600px */
                    @media (min-width: 600px) {
                        .gallery-grid {
                            display: grid;
                            grid-template-columns: repeat(3, 1fr);
                            gap: 15px; /* Spacing between grid elements */
                        }

                        /* Targets Pandoc's hidden wrapper elements (p or figure) */
                        .gallery-grid > p, 
                        .gallery-grid > figure {
                            margin: 0 !important;
                            padding: 0 !important;
                            width: 100% !important;
                        }

                        /* Forces images to fill their slot and crop uniformly */
                        .gallery-grid img {
                            width: 100% !important;
                            height: 250px !important; /* Forces a uniform height. Adjust this number as needed! */
                            object-fit: cover !important; /* Crops the images evenly instead of stretching them */
                            margin-bottom: 0 !important; 
                            display: block;
                        }
                    }
                    .gallery-container {
                        text-align: center;
                    }


                    html.glightbox-open,
                    body.glightbox-open {
                        overflow: auto !important;
                    }

                    .gslide-description {
                        display: none; 
                    }

                    .gscrollbar-fixer{
                        margin-right: auto !important;
                    }

                    .ginner-container .gslide-media {
                        max-width: 85vw !important;
                        max-height: 80vh !important;
                        margin: auto !important;
                    }

                    .ginner-container .gslide-image img {
                        max-width: 100% !important;
                        max-height: 100% !important;
                        object-fit: contain !important;
                    }


                    .gslide-image img.zoomable {
                        pointer-events: none !important;
                        cursor: default !important;
                    }
        </style>
    </head>
    <body>

        <header>
            <nav>
                <a href="index.html"><strong>Home</strong></a> / 
                <a href="art.html">Art</a> / 
                <a href="design.html">Design</a> / 
                <a href="teaching.html">Teaching</a> / 
                <a href="writing.html">Writing</a> / 
                <a href="zines.html">Zines</a>
            </nav>
            <hr>
        </header>

        <main>
            $body$
        </main>

        <footer>
            <hr>
            <p>&copy; 2026 Eurydice Dye</p>
        </footer>

        <script src="js/glightbox.min.js"></script>
        <script>
            const lightbox = GLightbox({
                selector: '.glightbox'
            });
        </script>

    </body>
</html>

        <!-- Custom Style Overrides -->
        <style>
            header nav {
                text-align: center;
                margin-bottom: 1em;
            }
                    header nav a {
                        margin: 0 10px; /* Adds even spacing between the links */
                        font-size: 2rem !important;
                    }
                    footer {
                        text-align: center;
                    }

                    /* On screens 600px wide and larger, hide the line break in the nav bar */
                    @media (min-width: 600px) {
                        .mobile-only-break {
                            display: none;
                        }
                    }


                    /* Only apply grid layouts on screens wider than 600px */
                    @media (min-width: 600px) {
                        .gallery-grid {
                            display: grid;
                            grid-template-columns: repeat(3, 1fr);
                            gap: 15px; /* Spacing between grid elements */
                        }

                        /* Targets Pandoc's hidden wrapper elements (p or figure) */
                        .gallery-grid > p, 
                        .gallery-grid > figure {
                            margin: 0 !important;
                            padding: 0 !important;
                            width: 100% !important;
                        }

                        /* Forces images to fill their slot and crop uniformly */
                        .gallery-grid img {
                            width: 100% !important;
                            height: 250px !important; /* Forces a uniform height. Adjust this number as needed! */
                            object-fit: cover !important; /* Crops the images evenly instead of stretching them */
                            margin-bottom: 0 !important; 
                            display: block;
                        }
                    }
                    .gallery-container {
                        text-align: center;
                    }


                    html.glightbox-open,
                    body.glightbox-open {
                        overflow: auto !important;
                    }

                    .gslide-description {
                        display: none; 
                    }

                    .gscrollbar-fixer{
                        margin-right: auto !important;
                    }

                    .ginner-container .gslide-media {
                        max-width: 85vw !important;
                        max-height: 80vh !important;
                        margin: auto !important;
                    }

                    .ginner-container .gslide-image img {
                        max-width: 85vw !important;
                        max-height: 80vh !important;
                        object-fit: contain !important;
                    }


                    .gslide-image img.zoomable {
                        pointer-events: none !important;
                        cursor: default !important;
                    }

                    .center-wrapper {
                        display: flex;
                        justify-content: center;
                        filter: drop-shadow(0px 1px 1em rgba(0, 0, 0, 0.2));
                        text-align: center;
                        font-size: 1.4rem;
                        padding-top: 1rem;
                    }

                    img {
                        margin-bottom: 0;
                    }

                    img[src$="#center"] {
                        display: block;
                        margin: 0 auto;
                        max-width: 300px;
                    }
        </style>
    </head>
